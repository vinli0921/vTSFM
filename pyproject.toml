[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vtsfm"
version = "0.1.0"
description = "An external vLLM plugin starter for time-series foundation models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
serve = [
  "vllm==0.33.0",
  "torch==2.14.0",
  "transformers==5.20.2",
  "pandas==2.3.3",
  "uvicorn==0.54.0",
  # The manual model validation suite runs inside each adapter environment.
  "requests==2.34.2",
  "nvidia-ml-py==13.615.71",
]
serve-chronos = [
  "vllm==0.16.0",
  "torch==2.9.1",
  "transformers==4.57.6",
  "pandas==2.3.3",
  "chronos-forecasting @ git+https://github.com/amazon-science/chronos-forecasting.git@ba47d25a04aedac33af2fb9780609afd54744d5e",
]
benchmark = [
  "numpy==2.2.6",
  "requests==2.34.2",
  "nvidia-ml-py==13.615.71",
  "matplotlib==3.11.2",
  "fastapi==0.156.2",
  "uvicorn==0.54.0",
]
dev = ["pytest==8.4.2", "build>=1.2,<2", "ruff==0.14.0"]
timesfm25 = [
  "timesfm @ git+https://github.com/google-research/timesfm.git@e51928e27119cb17bebc005be2696b75e0a9e688",
]
toto2 = [
  "toto-2 @ git+https://github.com/DataDog/toto.git@c079fd7e32424c5d33f9e267c5d32a5630242eb5#subdirectory=toto2",
  "dd-unit-scaling @ git+https://github.com/DataDog/toto.git@c079fd7e32424c5d33f9e267c5d32a5630242eb5#subdirectory=dd_unit_scaling",
]
moirai2 = [
  "uni2ts @ git+https://github.com/SalesforceAIResearch/uni2ts.git@cfd46d4510ed8896f263116f32928eede05b0a75",
  "jax==0.4.38", "jaxlib==0.4.38", "pyarrow==20.0.0",
]

[project.scripts]
vtsfm = "vtsfm.cli:main"

[project.entry-points."vllm.general_plugins"]
vtsfm = "vtsfm.plugin:register_models"

[project.entry-points."vllm.io_processor_plugins"]
vtsfm = "vtsfm.plugin:get_io_processor"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vtsfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: opt-in integration checks requiring Linux, CUDA, and serving dependencies"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Basic correctness checks only; formatting and stricter style rules stay advisory.
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]  # Assigned lambdas are a style choice, not a correctness gate.
