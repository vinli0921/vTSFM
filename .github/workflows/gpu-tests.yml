name: Modal GPU checks

on:
  workflow_dispatch:
    inputs:
      billing_limits_verified:
        description: 'I verified the Modal usage budget and $0 out-of-pocket spend limit'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: modal-gpu-checks
  cancel-in-progress: false

jobs:
  gpu:
    runs-on: ubuntu-24.04
    # Allow provisioning wait separately from the 300-second GPU execution cap.
    timeout-minutes: 30
    env:
      MODAL_GPU_ENABLED: ${{ vars.MODAL_GPU_ENABLED }}
    steps:
      - name: Require explicit billing acknowledgement
        env:
          BILLING_LIMITS_VERIFIED: ${{ inputs.billing_limits_verified }}
        run: |
          if [[ "$BILLING_LIMITS_VERIFIED" != true ]]; then
            echo '::error::Verify the Modal usage budget and $0 spend limit first. See docs/gpu-testing.md.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Check enablement and credentials before contacting Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m ci.gpu_checks
      - name: Install pinned Modal client
        run: python -m pip install modal==1.6.3
      - name: Run bounded CUDA correctness checks
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m ci.modal_gpu
