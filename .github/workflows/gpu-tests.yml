name: Modal GPU checks

on:
  pull_request:
    paths:
      - '.github/workflows/gpu-tests.yml'
      - 'ci/**'
      - 'src/vtsfm/batching.py'
      - 'src/vtsfm/execution.py'
      - 'src/vtsfm/adapters/base.py'
      - 'src/vtsfm/adapters/__init__.py'
      - 'src/vtsfm/adapters/forecast.py'
      - 'src/vtsfm/adapters/result_transport.py'
      - 'src/vtsfm/adapters/pooling.py'
      - 'src/vtsfm/adapters/*/spec.py'
      - 'src/vtsfm/adapters/registry.py'
      - 'examples/fake_adapter.py'
      - 'tests/test_cuda_contract.py'
      - 'tests/test_result_transport.py'
      - 'tests/test_execution.py'
      - 'tests/test_batching.py'
      - 'tests/test_modal_*.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      billing_limits_verified:
        description: 'I verified the Modal usage budget and $0 out-of-pocket spend limit'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: modal-gpu-checks
  cancel-in-progress: false

jobs:
  gpu:
    # Only repository collaborators' branches receive the Modal credentials.
    if: >-
      vars.MODAL_GPU_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    # Allow provisioning wait separately from the 300-second GPU execution cap.
    timeout-minutes: 30
    env:
      MODAL_GPU_ENABLED: ${{ vars.MODAL_GPU_ENABLED }}
      MODAL_APP_ID_FILE: .modal-gpu-${{ github.run_id }}-${{ github.run_attempt }}.app-id
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Check trusted trigger, billing acknowledgement, and credentials
        env:
          BILLING_LIMITS_VERIFIED: ${{ inputs.billing_limits_verified }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m ci.gpu_checks
      - name: Install pinned Modal client
        run: python -m pip install modal==1.6.3
      - name: Run bounded CUDA correctness checks
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal run -m ci.modal_gpu
      - name: Stop only the app created by this run
        if: always()
        timeout-minutes: 3
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [[ -e "$MODAL_APP_ID_FILE" || -L "$MODAL_APP_ID_FILE" ]]; then
            python -m ci.modal_cleanup
          else
            echo 'No app ID recorded; no GPU function was submitted by the entrypoint.'
          fi
